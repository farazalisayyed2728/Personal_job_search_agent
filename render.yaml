services:
  - type: web
    name: jobhunt-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JOBHUNT_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: JOBHUNT_SEEN_FILE
        value: /var/data/seen.json
      - key: JOBHUNT_PROFILE_FILE
        value: /var/data/profile.json
      - key: JOBHUNT_DIGEST_FILE
        value: /var/data/digest.html
      - key: JOBHUNT_TRACKER_CSV
        value: /var/data/tracker.csv
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false
    disk:
      name: jobhunt-state
      mountPath: /var/data
      sizeGB: 1
